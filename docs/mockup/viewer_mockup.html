<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>findsummits viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; }

    #header {
      padding: 6px 12px;
      background: #fff;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 14px; font-weight: bold; white-space: nowrap; }
    #meta { color: #666; font-size: 12px; white-space: nowrap; }
    #header .spacer { flex: 1; }
    #header button {
      padding: 4px 12px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #888;
      background: #f5f5f5;
      border-radius: 3px;
    }
    #header button:hover { background: #e0e0e0; }

    #filters { display: flex; align-items: center; gap: 10px; }
    #filters > span { font-size: 12px; color: #555; white-space: nowrap; }
    #filters label { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    #filters input[type="checkbox"] { cursor: pointer; width: 13px; height: 13px; accent-color: currentColor; }
    #filters label[data-cat="new"]       { color: #4D7A20; }
    #filters label[data-cat="dominant"]  { color: #C8101E; }
    #filters label[data-cat="changed"]   { color: #DC5D04; }
    #filters label[data-cat="unchanged"] { color: #888; }

    #map { flex: 1; }

    .popup-title { font-weight: bold; margin-bottom: 6px; }
    .popup-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 4px;
      color: #fff;
      background: #555;
    }
    .popup-row { margin: 3px 0; }
    .popup-row label { display: inline-block; width: 80px; color: #555; }
    .popup-input {
      width: 130px;
      padding: 2px 4px;
      font-size: 12px;
      border: 1px solid #aaa;
      border-radius: 2px;
    }
    .popup-save {
      margin-top: 6px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #888;
      background: #f5f5f5;
      border-radius: 2px;
    }
    .popup-hint { font-size: 11px; color: #888; margin-top: 4px; }
    .popup-notes-label { margin-top: 6px; font-size: 12px; color: #555; }
    .popup-textarea {
      width: 100%; min-height: 58px; margin-top: 2px;
      padding: 3px 4px; font-size: 11px; font-family: sans-serif;
      border: 1px solid #aaa; border-radius: 2px; resize: vertical; box-sizing: border-box;
    }

    /* エクスポートコントロール */
    .export-control .leaflet-control-layers-toggle {
      background-image: none;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 18px;
      width: 26px;
      height: 26px;
    }
    .export-control.leaflet-control-layers-expanded .leaflet-control-layers-toggle {
      display: none;
    }
    .export-control .leaflet-control-layers-list {
      min-width: 130px;
    }
    .export-ctrl-btn {
      display: block;
      width: 100%;
      padding: 5px 10px;
      margin: 2px 0;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #ccc;
      background: #f5f5f5;
      border-radius: 2px;
      text-align: left;
      white-space: nowrap;
    }
    .export-ctrl-btn:hover { background: #e0e0e0; }
  </style>
</head>

function createMeshGrid() {
  const lines  = L.layerGroup();
  const labels = L.layerGroup();

  const LAT_STEP = 2 / 3;
  const LON_STEP = 1;
  const MESH_COLOR = "#7B2FBE";

  JAPAN_MESHES.forEach(code => {
    const p = Math.floor(code / 100);
    const u = code % 100;
    const latMin = p * LAT_STEP;
    const latMax = latMin + LAT_STEP;
    const lonMin = u + 100;
    const lonMax = lonMin + LON_STEP;

    // 矩形枠線
    L.rectangle([[latMin, lonMin], [latMax, lonMax]], {
      color: MESH_COLOR, weight: 1.8, opacity: 0.7, fill: false, interactive: false
    }).addTo(lines);

    // ラベル（左下から少し内側）
    L.marker([latMin + LAT_STEP * 0.08, lonMin + LON_STEP * 0.04], {
      icon: L.divIcon({
        html: `<span style="font-size:13px;color:${MESH_COLOR};font-weight:bold;white-space:nowrap;text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 0 3px #fff;">${code}</span>`,
        className: "", iconSize: [42, 16], iconAnchor: [0, 16]
      }),
      interactive: false
    }).addTo(labels);
  });

  // labels を group 内で管理することでオーバーレイ OFF 時に自動削除される
  const LABEL_ZOOM = 7;
  const group = L.layerGroup([lines]);

  function syncLabels() {
    if (!map.hasLayer(group)) return;
    if (map.getZoom() >= LABEL_ZOOM) {
      if (!group.hasLayer(labels)) group.addLayer(labels);
    } else {
      if (group.hasLayer(labels)) group.removeLayer(labels);
    }
  }

  map.on("zoomend", syncLabels);
  map.on("overlayadd", e => { if (e.name === "1次メッシュ") syncLabels(); });

  return group;
}

const meshGrid = createMeshGrid();

// ---- 基準点レイヤー（地理院タイル cp） ----
function createCpLayer() {
  const group = L.layerGroup();
  const loadedTiles = new Set();
  let currentCpZ = -1;

  // タイルzoom: マップzoomに応じて地理院cpのzを決定
  function cpZ(mapZ) {
    if (mapZ >= 12) return 12;
    if (mapZ >= 8)  return mapZ;
    return 7;
  }

  // 緯度経度 → タイル座標
  function ll2tile(lat, lon, z) {
    const x = Math.floor((lon + 180) / 360 * Math.pow(2, z));
    const r = Math.PI / 180 * lat;
    const y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z));
    return { x, y };
  }

  // 基準点種別 → 色
  function cpColor(kind) {
    if (kind.includes("電子基準点"))  return "#0055cc";
    if (kind.includes("一等三角点"))  return "#cc0000";
    if (kind.includes("二等三角点"))  return "#e07000";
    if (kind.includes("三等三角点"))  return "#ccaa00";
    return "#888";
  }

  async function loadTile(z, x, y) {
    const key = `${z}/${x}/${y}`;
    if (loadedTiles.has(key)) return;
    loadedTiles.add(key);
    try {
      const res = await fetch(`https://cyberjapandata.gsi.go.jp/xyz/cp/${z}/${x}/${y}.geojson`);
      if (!res.ok) return;
      const data = await res.json();
      L.geoJSON(data, {
        pointToLayer: (f, latlng) => {
          const color = cpColor(f.properties["基準点種別"] || "");
          return L.circleMarker(latlng, {
            radius: 4, color, fillColor: "#fff", fillOpacity: 1, weight: 1.5
          });
        },
        onEachFeature: (f, layer) => {
          const p = f.properties;
          layer.bindPopup(
            `<b>${p["点名"] || "−"}</b><br>${p["基準点種別"] || "−"}<br><small>${p["基準点コード"] || ""}</small>`
          );
        }
      }).addTo(group);
    } catch(e) {}
  }

  async function update() {
    if (!map.hasLayer(group)) return;
    const z = cpZ(map.getZoom());
    if (z !== currentCpZ) {          // zが変わったら全クリア
      group.clearLayers();
      loadedTiles.clear();
      currentCpZ = z;
    }
    const b = map.getBounds();
    const sw = ll2tile(b.getSouth(), b.getWest(), z);
    const ne = ll2tile(b.getNorth(), b.getEast(), z);
    const fetches = [];
    for (let x = sw.x; x <= ne.x; x++)
      for (let y = ne.y; y <= sw.y; y++)
        fetches.push(loadTile(z, x, y));
    await Promise.all(fetches);
  }

  const CP_ATTR = '基準点データ: <a href="https://www.gsi.go.jp/" target="_blank">国土地理院</a>';

  map.on("moveend zoomend", update);
  map.on("overlayadd",    e => { if (e.name === "基準点") { map.attributionControl.addAttribution(CP_ATTR); update(); } });
  map.on("overlayremove", e => { if (e.name === "基準点") { map.attributionControl.removeAttribution(CP_ATTR); group.clearLayers(); loadedTiles.clear(); currentCpZ = -1; } });

  return group;
}

const cpLayer = createCpLayer();

// ---- レイヤーコントロール ----
L.control.layers(baseLayers, { "1次メッシュ": meshGrid, "基準点": cpLayer }, { position: "topleft" }).addTo(map);

// ---- localStorage ----
const storageKey = "sota_viewer_" + GEOJSON_DATA.metadata.generated_at;
let savedInputs = {};
try { savedInputs = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch(e) {}

// ---- フィルター用レイヤーグループ ----
// カテゴリ: new / dominant / changed（matched で入力あり）/ unchanged（matched で入力なし）
const filterGroups = {
  new:       L.layerGroup().addTo(map),
  dominant:  L.layerGroup().addTo(map),
  changed:   L.layerGroup().addTo(map),
  unchanged: L.layerGroup().addTo(map),
};

// summit_code → カテゴリ のマップ（フィーチャ振り分け用）
const peakCategory = {};

// カテゴリ判定（peak フィーチャ用）
function categorize(matchStatus) {
  if (matchStatus === "new")      return "new";
  if (matchStatus === "dominant") return "dominant";
  return "unchanged";
}

// フィーチャをカテゴリに振り分けて描画
function renderFeatures() {
  Object.values(filterGroups).forEach(g => g.clearLayers());

  // summit_code → category を先に解決
  GEOJSON_DATA.features.forEach(f => {
    const p = f.properties;
    if (p.feature_type !== "peak") return;
    peakCategory[p.summit_code] = categorize(p.match_status);
  });

  // summit_code → peak feature のマップ（各フィーチャのカテゴリ解決用）
  const peakByCode = {};
  const colByCode = {};
  const summitByCode = {};
  GEOJSON_DATA.features.forEach(f => {
    const ft = f.properties.feature_type;
    if (ft === "peak")   peakByCode[f.properties.summit_code]   = f;
    if (ft === "col")    colByCode[f.properties.summit_code]     = f;
    if (ft === "summit") summitByCode[f.properties.summit_code]  = f;
  });

  GEOJSON_DATA.features.forEach(f => {
    const p = f.properties;
    const geom = f.geometry;
    const color = pointsToColor(p.points);

    function catByCode(code) {
      return peakCategory[code] || "unchanged";
    }

    if (p.feature_type === "activation_zone") {
      const cat = catByCode(p.summit_code);
      L.polygon(geom.coordinates[0].map(c => [c[1], c[0]]), {
        color, fillColor: color, fillOpacity: 0.1, weight: 1
      }).addTo(filterGroups[cat]);
      return;
    }

    if (p.feature_type === "delete_zone") {
      const cat = catByCode(p.summit_code);
      const pkColor = pointsToColor(peakByCode[p.summit_code]?.properties.points);
      L.polygon(geom.coordinates[0].map(c => [c[1], c[0]]), {
        color: pkColor, fillColor: pkColor, fillOpacity: 0.15, weight: 1.5, dashArray: "4,3"
      }).addTo(filterGroups[cat]);
      return;
    }

    if (p.feature_type === "prominence_range") {
      const cat = catByCode(p.summit_code);
      L.polyline(geom.coordinates.map(c => [c[1], c[0]]),
        { color: "#aaa", weight: 1.5, dashArray: "4,3" }).addTo(filterGroups[cat]);
      return;
    }

    if (p.feature_type === "coord_diff") {
      const cat = catByCode(p.summit_code);
      L.polyline(geom.coordinates.map(c => [c[1], c[0]]),
        { color: "#aaa", weight: 1.5, dashArray: "4,3" }).addTo(filterGroups[cat]);
      return;
    }

    if (p.feature_type === "peak") {
      const coordKey = p.summit_code;
      const cat = peakCategory[coordKey];
      const saved = savedInputs[coordKey] || {};
      const marker = L.marker([geom.coordinates[1], geom.coordinates[0]], { icon: peakIcon(color) });

      const pkLat = geom.coordinates[1].toFixed(5);
      const pkLon = geom.coordinates[0].toFixed(5);
      // key_col_resolved=false → 陸地最高峰 or 島嶼部最高峰
      const domLabel = !p.key_col_resolved ? (p.is_island ? '島嶼部最高峰' : '陸地最高峰') : null;
      const domBadge = domLabel
        ? `<span class="popup-badge" style="background:#7B2FBE">${domLabel}</span>`
        : '';
      const colRow = domLabel
        ? `<div class="popup-row"><label>Keyコル</label><span style="color:#888">未定義（${domLabel}）</span></div>`
        : '';

      if (p.match_status === "new") {
        const colF = colByCode[p.summit_code];
        const colElevStr = colF ? `${colF.properties.col_elev}m` : '（陸地最高峰のため未定義）';
        const initNotes = `国土地理院標高タイルで解析\n${pkLat},${pkLon}\n所在地：\nコル標高：${colElevStr}\nプロミネンス：${p.prominence}m`;
        marker.bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-caret-up" style="color:${color}"></i> 新規ピーク<span class="popup-badge">new</span>${domBadge}</div>
          <div class="popup-row"><label>仮コード</label>${p.summit_code}</div>
          <div class="popup-row"><label>緯度</label>${pkLat}</div>
          <div class="popup-row"><label>経度</label>${pkLon}</div>
          <div class="popup-row"><label>標高</label>${p.peak_elev}m</div>
          <div class="popup-row"><label>ポイント</label>${p.points}pt</div>
          <div class="popup-row"><label>プロミネンス</label>${p.prominence}m</div>
          ${colRow}
          <div class="popup-row"><label>山岳名JP</label><input class="popup-input" id="jp_${coordKey}" value="${saved.jp||''}" placeholder="例: ○○山"></div>
          <div class="popup-row"><label>山岳名EN</label><input class="popup-input" id="en_${coordKey}" value="${saved.en||''}" placeholder="例: Maruyama"></div>
          <div class="popup-notes-label">変更の根拠</div>
          <textarea class="popup-textarea" id="notes_${coordKey}">${saved.notes || initNotes}</textarea>
          <button class="popup-save" onclick="saveInput('${coordKey}')">保存</button>
          <div class="popup-hint">入力内容はブラウザに自動保存されます</div>
        `);
      } else if (p.match_status === "matched") {
        if (p.is_band_change_candidate) {
          const sumF = summitByCode[p.summit_code];
          const sotaAltM = sumF?.properties.sota_alt_m ?? '';
          const sotaPts  = sumF?.properties.sota_points ?? '';
          const initNotes = `国土地理院 DEM 解析による標高再測定: ${sotaAltM}m (${sotaPts}pt) → ${Math.floor(p.peak_elev)}m (${p.points}pt)\n座標: ${pkLat},${pkLon}（）`;
          marker.bindPopup(`
            <div class="popup-title"><i class="fa-solid fa-caret-up" style="color:${color}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">matched</span>${domBadge}</div>
            <div class="popup-row"><label>コード</label>${p.summit_code}</div>
            <div class="popup-row"><label>緯度</label>${pkLat}</div>
            <div class="popup-row"><label>経度</label>${pkLon}</div>
            <div class="popup-row"><label>山岳名JP</label>${p.summit_name_jp || '—'}</div>
            <div class="popup-row"><label>山岳名EN</label>${p.summit_name || '—'}</div>
            <div class="popup-row"><label>解析標高</label>${p.peak_elev}m</div>
            <div class="popup-row"><label>ポイント</label>${p.points}pt（SOTA: ${sotaPts}pt → 変更候補）</div>
            ${colRow}
            <div class="popup-notes-label">変更の根拠</div>
            <textarea class="popup-textarea" id="notes_${coordKey}">${saved.notes || initNotes}</textarea>
            <button class="popup-save" onclick="saveInput('${coordKey}')">保存</button>
            <div class="popup-hint">入力内容はブラウザに自動保存されます</div>
          `);
        } else {
          marker.bindPopup(`
            <div class="popup-title"><i class="fa-solid fa-caret-up" style="color:${color}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">matched</span>${domBadge}</div>
            <div class="popup-row"><label>コード</label>${p.summit_code}</div>
            <div class="popup-row"><label>緯度</label>${pkLat}</div>
            <div class="popup-row"><label>経度</label>${pkLon}</div>
            <div class="popup-row"><label>山岳名JP</label>${p.summit_name_jp || '—'}</div>
            <div class="popup-row"><label>山岳名EN</label>${p.summit_name || '—'}</div>
            <div class="popup-row"><label>解析標高</label>${p.peak_elev}m</div>
            <div class="popup-row"><label>ポイント</label>${p.points}pt</div>
            ${colRow}
            <div class="popup-notes-label">変更の根拠</div>
            <div style="color:#888;font-size:11px">—（変更なし）</div>
          `);
        }
      } else {
        const colF = colByCode[p.summit_code];
        const colElevStr = colF ? `${colF.properties.col_elev}m` : '（陸地最高峰のため未定義）';
        const initNotes = `国土地理院標高タイルで解析\n${pkLat},${pkLon}\n所在地：\nコル標高：${colElevStr}\nプロミネンス：${p.prominence}m`;
        marker.bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-caret-up" style="color:${color}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">dominant</span>${domBadge}</div>
          <div class="popup-row"><label>コード</label>${p.summit_code}</div>
          <div class="popup-row"><label>緯度</label>${pkLat}</div>
          <div class="popup-row"><label>経度</label>${pkLon}</div>
          <div class="popup-row"><label>山岳名JP</label>${p.summit_name_jp || '—'}</div>
          <div class="popup-row"><label>山岳名EN</label>${p.summit_name || '—'}</div>
          <div class="popup-row"><label>解析標高</label>${p.peak_elev}m</div>
          <div class="popup-row"><label>ポイント</label>${p.points}pt</div>
          <div class="popup-row"><label>プロミネンス</label>${p.prominence}m</div>
          ${colRow}
          <div class="popup-notes-label">変更の根拠</div>
          <textarea class="popup-textarea" id="notes_${coordKey}">${saved.notes || initNotes}</textarea>
          <button class="popup-save" onclick="saveInput('${coordKey}')">保存</button>
          <div class="popup-hint">入力内容はブラウザに自動保存されます</div>
        `);
      }
      marker.addTo(filterGroups[cat]);
      return;
    }

    if (p.feature_type === "col") {
      const cat = catByCode(p.summit_code);
      const colLat = geom.coordinates[1].toFixed(5);
      const colLon = geom.coordinates[0].toFixed(5);
      const colParentPeak = peakByCode[p.summit_code];
      const colPeakCode = p.summit_code;
      const colCodeLabel = colParentPeak?.properties.match_status === "new" ? "仮コード" : "コード";
      L.marker([geom.coordinates[1], geom.coordinates[0]], { icon: colIcon(color) })
        .bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-caret-down" style="color:${color}"></i> Keyコル</div>
          ${colPeakCode ? `<div class="popup-row"><label>${colCodeLabel}</label>${colPeakCode}</div>` : ""}
          <div class="popup-row"><label>緯度</label>${colLat}</div>
          <div class="popup-row"><label>経度</label>${colLon}</div>
          <div class="popup-row"><label>標高</label>${p.col_elev}m</div>
        `)
        .addTo(filterGroups[cat]);
      return;
    }

    if (p.feature_type === "summit") {
      const sotaColor = pointsToColor(p.sota_points);
      const cat = peakCategory[p.summit_code] ?? (p.match_status === "delete" ? "dominant" : "unchanged");
      const badge = p.match_status === "delete" ? "delete" : "matched";
      const sotaLat = geom.coordinates[1].toFixed(5);
      const sotaLon = geom.coordinates[0].toFixed(5);
      let summitPopupHtml;
      if (p.match_status === "delete") {
        const defaultNotes = `国土地理院標高タイルを解析し、${p.dominant_peak_code}に従属している事を確認`;
        const savedNotes = savedInputs[p.summit_code]?.notes ?? defaultNotes;
        summitPopupHtml = `
          <div class="popup-title"><i class="fa-solid fa-circle" style="color:${sotaColor}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">${badge}</span></div>
          <div class="popup-row"><label>コード</label>${p.summit_code}</div>
          <div class="popup-row"><label>緯度</label>${sotaLat}</div>
          <div class="popup-row"><label>経度</label>${sotaLon}</div>
          <div class="popup-row"><label>SOTA標高</label>${p.sota_alt_m}m</div>
          <div class="popup-row"><label>ポイント</label>${p.sota_points}pt</div>
          <div class="popup-notes-label">変更の根拠</div>
          <textarea id="notes_${p.summit_code}" class="popup-textarea">${savedNotes}</textarea>
          <button onclick="saveInput('${p.summit_code}')" style="margin-top:4px;width:100%;font-size:11px;">保存</button>
        `;
      } else {
        summitPopupHtml = `
          <div class="popup-title"><i class="fa-solid fa-circle" style="color:${sotaColor}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">${badge}</span></div>
          <div class="popup-row"><label>コード</label>${p.summit_code}</div>
          <div class="popup-row"><label>緯度</label>${sotaLat}</div>
          <div class="popup-row"><label>経度</label>${sotaLon}</div>
          <div class="popup-row"><label>SOTA標高</label>${p.sota_alt_m}m</div>
          <div class="popup-row"><label>ポイント</label>${p.sota_points}pt</div>
        `;
      }
      L.marker([geom.coordinates[1], geom.coordinates[0]], { icon: sotaIcon(sotaColor) })
        .bindPopup(summitPopupHtml)
        .addTo(filterGroups[cat]);
    }
  });
}

renderFeatures();

// ---- フィルター チェックボックス ----
document.querySelectorAll("#filters input[type='checkbox']").forEach(cb => {
  cb.addEventListener("change", () => {
    if (cb.checked) filterGroups[cb.dataset.cat].addTo(map);
    else            map.removeLayer(filterGroups[cb.dataset.cat]);
  });
});

// ---- localStorage 保存 ----
function saveInput(key) {
  const jp    = document.getElementById("jp_"    + key)?.value || "";
  const en    = document.getElementById("en_"    + key)?.value || "";
  const notes = document.getElementById("notes_" + key)?.value || "";
  savedInputs[key] = { jp, en, notes };
  localStorage.setItem(storageKey, JSON.stringify(savedInputs));
  renderFeatures(); // 変更あり/なし の再分類
  // 再描画後に変更したフィルターグループを地図に反映
  document.querySelectorAll(".filter-btn").forEach(b => {
    if (b.classList.contains("active")) filterGroups[b.dataset.cat].addTo(map);
  });
}

// ---- エクスポートコントロール（ズームボタン下・topright）----
const ExportControl = L.Control.extend({
  options: { position: "topright" },
  onAdd() {
    const container = L.DomUtil.create("div", "leaflet-control-layers leaflet-control export-control");

    const toggle = L.DomUtil.create("a", "leaflet-control-layers-toggle", container);
    toggle.href = "#";
    toggle.title = "エクスポート";
    toggle.innerHTML = '<i class="fa-solid fa-file-export" style="pointer-events:none;"></i>';

    const list = L.DomUtil.create("div", "leaflet-control-layers-list", container);

    const mkBtn = (label, id) => {
      const btn = L.DomUtil.create("button", "export-ctrl-btn", list);
      btn.id = id;
      btn.textContent = label;
    };
    mkBtn("申請書エクスポート", "btn-export");
    mkBtn("公開用エクスポート", "btn-publish");

    L.DomEvent.on(container, "mouseenter", () => L.DomUtil.addClass(container, "leaflet-control-layers-expanded"));
    L.DomEvent.on(container, "mouseleave", () => L.DomUtil.removeClass(container, "leaflet-control-layers-expanded"));
    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);
    return container;
  }
});
new ExportControl().addTo(map);

// ---- ボタン ----
document.getElementById("btn-export").addEventListener("click", () => {
  alert("（モックアップ）申請書 XLSX をエクスポートします\n実物では SheetJS で XLSX を生成してダウンロードします");
});
document.getElementById("btn-publish").addEventListener("click", () => {
  alert("（モックアップ）公開用 HTML をエクスポートします\n実物では入力内容を埋め込んだ閲覧専用 HTML をダウンロードします");
});
</script>
