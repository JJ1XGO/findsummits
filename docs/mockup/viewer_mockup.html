<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>findsummits viewer</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; font-size: 13px; display: flex; flex-direction: column; height: 100vh; }

    #header {
      padding: 6px 12px;
      background: #fff;
      border-bottom: 1px solid #ccc;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    #header h1 { font-size: 14px; font-weight: bold; white-space: nowrap; }
    #meta { color: #666; font-size: 12px; white-space: nowrap; }
    #header .spacer { flex: 1; }
    #header button {
      padding: 4px 12px;
      font-size: 13px;
      cursor: pointer;
      border: 1px solid #888;
      background: #f5f5f5;
      border-radius: 3px;
    }
    #header button:hover { background: #e0e0e0; }

    #filters { display: flex; align-items: center; gap: 10px; }
    #filters > span { font-size: 12px; color: #555; white-space: nowrap; }
    #filters label { display: flex; align-items: center; gap: 4px; font-size: 12px; cursor: pointer; white-space: nowrap; }
    #filters input[type="checkbox"] { cursor: pointer; width: 13px; height: 13px; accent-color: currentColor; }
    #filters label[data-cat="new"]       { color: #4D7A20; }
    #filters label[data-cat="deleted"]   { color: #C8101E; }
    #filters label[data-cat="changed"]   { color: #DC5D04; }
    #filters label[data-cat="unchanged"] { color: #888; }

    #map { flex: 1; }

    .popup-title { font-weight: bold; margin-bottom: 6px; }
    .popup-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 3px;
      font-size: 11px;
      margin-left: 4px;
      color: #fff;
      background: #555;
    }
    .popup-row { margin: 3px 0; }
    .popup-row label { display: inline-block; width: 80px; color: #555; }
    .popup-input {
      width: 130px;
      padding: 2px 4px;
      font-size: 12px;
      border: 1px solid #aaa;
      border-radius: 2px;
    }
    .popup-save {
      margin-top: 6px;
      padding: 3px 10px;
      font-size: 12px;
      cursor: pointer;
      border: 1px solid #888;
      background: #f5f5f5;
      border-radius: 2px;
    }
    .popup-hint { font-size: 11px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>

<div id="header">
  <h1>findsummits viewer</h1>
  <span id="meta">サミットリスト基準日: 2026-01-01 　解析日時: 2026-05-13 09:00 JST</span>
  <span class="spacer"></span>
  <div id="filters">
    <span>表示:</span>
    <label data-cat="new">       <input type="checkbox" data-cat="new"       checked> 新規</label>
    <label data-cat="deleted">   <input type="checkbox" data-cat="deleted"   checked> 削除</label>
    <label data-cat="changed">   <input type="checkbox" data-cat="changed"   checked> 変更あり</label>
    <label data-cat="unchanged"> <input type="checkbox" data-cat="unchanged" checked> 変更なし</label>
  </div>
  <button id="btn-export">申請書エクスポート</button>
  <button id="btn-publish">公開用エクスポート</button>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
// ---- ダミーデータ（実物では merged.geojson の内容が埋め込まれる） ----
// points は merge.py が peak_elev / sota_alt_m から標高バンドで算出してセットする
const GEOJSON_DATA = {
  type: "FeatureCollection",
  metadata: {

    generated_at: "2026-05-13T09:00:00+09:00"
  },
  features: [
    // ── new: 新規ピーク候補（1521m → 10pt）────────────────────────────
    { type: "Feature", geometry: { type: "Point", coordinates: [138.73, 35.36] },
      properties: { type: "peak", match_status: "new", provisional_code: "JA/NEW-001",
                    peak_elev: 1521, prominence: 210, stability: "confirmed", is_tile_top: 0,
                    points: 10 } },
    { type: "Feature", geometry: { type: "Polygon", coordinates: [[[138.720,35.350],[138.740,35.350],[138.740,35.370],[138.720,35.370],[138.720,35.350]]] },
      properties: { type: "activation_area", peak_lat: 35.36, peak_lon: 138.73, area_truncated: false, points: 10 } },
    { type: "Feature", geometry: { type: "Point", coordinates: [138.71, 35.33] },
      properties: { type: "col", peak_lat: 35.36, peak_lon: 138.73, col_elev: 1311, points: 10 } },
    { type: "Feature", geometry: { type: "Polygon", coordinates: [[[138.695,35.315],[138.725,35.315],[138.725,35.345],[138.695,35.345],[138.695,35.315]]] },

    { type: "Feature", geometry: { type: "LineString", coordinates: [[138.73,35.36],[138.71,35.33]] },
      properties: { type: "prominence_range" } },

    // ── new: 新規ピーク候補（580m → 2pt）─────────────────────────────
    { type: "Feature", geometry: { type: "Point", coordinates: [138.68, 35.31] },
      properties: { type: "peak", match_status: "new", provisional_code: "JA/NEW-002",
                    peak_elev: 580, prominence: 165, stability: "confirmed", is_tile_top: 0,
                    points: 2 } },
    { type: "Feature", geometry: { type: "Polygon", coordinates: [[[138.670,35.300],[138.690,35.300],[138.690,35.320],[138.670,35.320],[138.670,35.300]]] },
      properties: { type: "activation_area", peak_lat: 35.31, peak_lon: 138.68, area_truncated: false, points: 2 } },
    { type: "Feature", geometry: { type: "Point", coordinates: [138.66, 35.29] },
      properties: { type: "col", peak_lat: 35.31, peak_lon: 138.68, col_elev: 415, points: 2 } },
    { type: "Feature", geometry: { type: "Polygon", coordinates: [[[138.650,35.278],[138.672,35.278],[138.672,35.302],[138.650,35.302],[138.650,35.278]]] },
      properties: { type: "key_col_boundary", peak_lat: 35.31, peak_lon: 138.68 } },
    { type: "Feature", geometry: { type: "LineString", coordinates: [[138.68,35.31],[138.66,35.29]] },
      properties: { type: "prominence_range" } },

    // ── matched: 既存サミットと一致（3776m → 10pt）───────────────────
    { type: "Feature", geometry: { type: "Point", coordinates: [138.80, 35.42] },
      properties: { type: "peak", match_status: "matched",
                    summit_code: "JA/YN-001", summit_name: "Fuji-san", summit_name_jp: "富士山",
                    peak_elev: 3776, prominence: 3776, stability: "confirmed", is_tile_top: 0,
                    points: 10 } },
    { type: "Feature", geometry: { type: "Polygon", coordinates: [[[138.790,35.410],[138.810,35.410],[138.810,35.430],[138.790,35.430],[138.790,35.410]]] },
      properties: { type: "activation_area", peak_lat: 35.42, peak_lon: 138.80, area_truncated: false, points: 10 } },
    { type: "Feature", geometry: { type: "Point", coordinates: [138.76, 35.38] },
      properties: { type: "col", peak_lat: 35.42, peak_lon: 138.80, col_elev: 1200, points: 10 } },
    { type: "Feature", geometry: { type: "Point", coordinates: [138.78, 35.39] },
      properties: { type: "sota_summit", match_status: "matched",
                    summit_code: "JA/YN-001", summit_name: "Fuji-san", summit_name_jp: "富士山",
                    sota_alt_m: 3776, points: 10 } },
    { type: "Feature", geometry: { type: "LineString", coordinates: [[138.80,35.42],[138.76,35.38]] },
      properties: { type: "prominence_range" } },
    { type: "Feature", geometry: { type: "LineString", coordinates: [[138.80,35.42],[138.78,35.39]] },
      properties: { type: "coord_diff", match_status: "matched" } },

    // ── deleted: 削除候補（ピーク 1050m → 8pt・SOTA サミット 880m → 6pt）──
    // 本ツール検出ピーク(8pt)のアクティベーションゾーン外、かつコル等高線内に
    // SOTA 既存サミット(6pt)が位置している → 削除候補
    { type: "Feature", geometry: { type: "Point", coordinates: [138.65, 35.25] },
      properties: { type: "peak", match_status: "deleted",
                    summit_code: "JA/YN-099", summit_name: "Sample-yama", summit_name_jp: "サンプル山",
                    peak_elev: 1050, prominence: 320, stability: "confirmed", is_tile_top: 0,
                    points: 8 } },
    { type: "Feature", geometry: { type: "Polygon", coordinates: [[[138.640,35.240],[138.660,35.240],[138.660,35.260],[138.640,35.260],[138.640,35.240]]] },
      properties: { type: "activation_area", peak_lat: 35.25, peak_lon: 138.65, area_truncated: false, points: 8 } },
    { type: "Feature", geometry: { type: "Point", coordinates: [138.63, 35.23] },
      properties: { type: "col", peak_lat: 35.25, peak_lon: 138.65, col_elev: 730, points: 8 } },
    { type: "Feature", geometry: { type: "Point", coordinates: [138.655, 35.245] },
      properties: { type: "sota_summit", match_status: "deleted",
                    summit_code: "JA/YN-099", summit_name: "Sample-yama", summit_name_jp: "サンプル山",
                    sota_alt_m: 880, points: 6 } },
    { type: "Feature", geometry: { type: "Polygon", coordinates: [[[138.635,35.230],[138.665,35.230],[138.665,35.270],[138.635,35.270],[138.635,35.230]]] },
      properties: { type: "key_col_boundary", peak_lat: 35.25, peak_lon: 138.65 } },
    { type: "Feature", geometry: { type: "LineString", coordinates: [[138.65,35.25],[138.63,35.23]] },
      properties: { type: "prominence_range" } },
    { type: "Feature", geometry: { type: "LineString", coordinates: [[138.65,35.25],[138.655,35.245]] },
      properties: { type: "coord_diff", match_status: "deleted" } }
  ]
};

// ---- points → 色 ----
function pointsToColor(pts) {
  const map = { 1: "#4D7A20", 2: "#6DA536", 4: "#AEA727", 6: "#EFA818", 8: "#DC5D04", 10: "#C8101E" };
  return map[pts] || "#888";
}

const WHITE_OUTLINE = "text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 -2px 0 #fff,0 2px 0 #fff,-2px 0 0 #fff,2px 0 0 #fff";
const CIRCLE_PX = 16;   // fa-circle はフル描画なのでそのまま
const TRIANGLE_PX = 24; // fa-caret は余白が多いので大きめにして視覚サイズを揃える

function peakIcon(color) {
  return L.divIcon({
    html: `<i class="fa-solid fa-caret-up" style="color:${color};font-size:${TRIANGLE_PX}px;line-height:1;display:inline-block;transform:scaleY(1.5);transform-origin:bottom center;${WHITE_OUTLINE};"></i>`,
    iconSize: [TRIANGLE_PX, TRIANGLE_PX], iconAnchor: [TRIANGLE_PX / 2, TRIANGLE_PX], className: ""
  });
}
function colIcon(color) {
  return L.divIcon({
    html: `<i class="fa-solid fa-caret-down" style="color:${color};font-size:${TRIANGLE_PX}px;line-height:1;display:inline-block;transform:scaleY(1.5);transform-origin:top center;${WHITE_OUTLINE};"></i>`,
    iconSize: [TRIANGLE_PX, TRIANGLE_PX], iconAnchor: [TRIANGLE_PX / 2, 0], className: ""
  });
}
function sotaIcon(color) {
  return L.divIcon({
    html: `<i class="fa-solid fa-circle" style="color:${color};font-size:${CIRCLE_PX}px;line-height:1;${WHITE_OUTLINE};"></i>`,
    iconSize: [CIRCLE_PX, CIRCLE_PX], iconAnchor: [CIRCLE_PX / 2, CIRCLE_PX / 2], className: ""
  });
}

// ---- 地図初期化 ----
const map = L.map("map", { zoomControl: false }).setView([35.33, 138.72], 10);
L.control.scale({ position: "bottomright", imperial: false, maxWidth: 150 }).addTo(map);
L.control.zoom({ position: "bottomright" }).addTo(map);

const baseLayers = {
  "国土地理院": L.tileLayer(
    "https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png",
    { attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">© 国土地理院</a>', maxZoom: 18 }
  ),
  "OSM": L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    { attribution: '<a href="https://www.openstreetmap.org/copyright" target="_blank">© OpenStreetMap contributors</a>', maxZoom: 19 }
  ),
  "OpenTopoMap": L.tileLayer(
    "https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png",
    { attribution: '<a href="https://opentopomap.org" target="_blank">© OpenTopoMap</a> (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank">CC-BY-SA</a>)', maxZoom: 17 }
  )
};
baseLayers["国土地理院"].addTo(map);

// ---- 1次メッシュグリッド（日本国土 176 メッシュのみ）----
const JAPAN_MESHES = [
  3036,3622,3623,3624,3631,3641,3653,3724,3725,3741,3823,3824,3831,3841,
  3926,3927,3928,3942,4027,4028,4040,4042,4128,4129,4142,4229,4230,4328,
  4329,4429,4440,4529,4530,4531,4540,4629,4630,4631,4728,4729,4730,4731,
  4739,4740,4828,4829,4830,4831,4839,4928,4929,4930,4931,4932,4933,4934,
  4939,5029,5030,5031,5032,5033,5034,5035,5036,5038,5039,5129,5130,5131,
  5132,5133,5134,5135,5136,5137,5138,5139,5229,5231,5232,5233,5234,5235,
  5236,5237,5238,5239,5240,5332,5333,5334,5335,5336,5337,5338,5339,5340,
  5432,5433,5435,5436,5437,5438,5439,5440,5531,5536,5537,5538,5539,5540,
  5541,5636,5637,5638,5639,5640,5641,5738,5739,5740,5741,5839,5840,5841,
  5939,5940,5941,5942,6039,6040,6041,6139,6140,6141,6239,6240,6241,6243,
  6339,6340,6341,6342,6343,6439,6440,6441,6442,6443,6444,6445,6540,6541,
  6542,6543,6544,6545,6546,6641,6642,6643,6644,6645,6646,6647,6740,6741,
  6742,6747,6748,6840,6841,6842,6847,6848
];

function createMeshGrid() {
  const lines  = L.layerGroup();
  const labels = L.layerGroup();

  const LAT_STEP = 2 / 3;
  const LON_STEP = 1;
  const MESH_COLOR = "#7B2FBE";

  JAPAN_MESHES.forEach(code => {
    const p = Math.floor(code / 100);
    const u = code % 100;
    const latMin = p * LAT_STEP;
    const latMax = latMin + LAT_STEP;
    const lonMin = u + 100;
    const lonMax = lonMin + LON_STEP;

    // 矩形枠線
    L.rectangle([[latMin, lonMin], [latMax, lonMax]], {
      color: MESH_COLOR, weight: 1.8, opacity: 0.7, fill: false, interactive: false
    }).addTo(lines);

    // ラベル（左下から少し内側）
    L.marker([latMin + LAT_STEP * 0.08, lonMin + LON_STEP * 0.04], {
      icon: L.divIcon({
        html: `<span style="font-size:13px;color:${MESH_COLOR};font-weight:bold;white-space:nowrap;text-shadow:1px 1px 0 #fff,-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,0 0 3px #fff;">${code}</span>`,
        className: "", iconSize: [42, 16], iconAnchor: [0, 16]
      }),
      interactive: false
    }).addTo(labels);
  });

  // labels を group 内で管理することでオーバーレイ OFF 時に自動削除される
  const LABEL_ZOOM = 7;
  const group = L.layerGroup([lines]);

  function syncLabels() {
    if (!map.hasLayer(group)) return;
    if (map.getZoom() >= LABEL_ZOOM) {
      if (!group.hasLayer(labels)) group.addLayer(labels);
    } else {
      if (group.hasLayer(labels)) group.removeLayer(labels);
    }
  }

  map.on("zoomend", syncLabels);
  map.on("overlayadd", e => { if (e.name === "1次メッシュ") syncLabels(); });

  return group;
}

const meshGrid = createMeshGrid();

// ---- 基準点レイヤー（地理院タイル cp） ----
function createCpLayer() {
  const group = L.layerGroup();
  const loadedTiles = new Set();
  let currentCpZ = -1;

  // タイルzoom: マップzoomに応じて地理院cpのzを決定
  function cpZ(mapZ) {
    if (mapZ >= 12) return 12;
    if (mapZ >= 8)  return mapZ;
    return 7;
  }

  // 緯度経度 → タイル座標
  function ll2tile(lat, lon, z) {
    const x = Math.floor((lon + 180) / 360 * Math.pow(2, z));
    const r = Math.PI / 180 * lat;
    const y = Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z));
    return { x, y };
  }

  // 基準点種別 → 色
  function cpColor(kind) {
    if (kind.includes("電子基準点"))  return "#0055cc";
    if (kind.includes("一等三角点"))  return "#cc0000";
    if (kind.includes("二等三角点"))  return "#e07000";
    if (kind.includes("三等三角点"))  return "#ccaa00";
    return "#888";
  }

  async function loadTile(z, x, y) {
    const key = `${z}/${x}/${y}`;
    if (loadedTiles.has(key)) return;
    loadedTiles.add(key);
    try {
      const res = await fetch(`https://cyberjapandata.gsi.go.jp/xyz/cp/${z}/${x}/${y}.geojson`);
      if (!res.ok) return;
      const data = await res.json();
      L.geoJSON(data, {
        pointToLayer: (f, latlng) => {
          const color = cpColor(f.properties["基準点種別"] || "");
          return L.circleMarker(latlng, {
            radius: 4, color, fillColor: "#fff", fillOpacity: 1, weight: 1.5
          });
        },
        onEachFeature: (f, layer) => {
          const p = f.properties;
          layer.bindPopup(
            `<b>${p["点名"] || "−"}</b><br>${p["基準点種別"] || "−"}<br><small>${p["基準点コード"] || ""}</small>`
          );
        }
      }).addTo(group);
    } catch(e) {}
  }

  async function update() {
    if (!map.hasLayer(group)) return;
    const z = cpZ(map.getZoom());
    if (z !== currentCpZ) {          // zが変わったら全クリア
      group.clearLayers();
      loadedTiles.clear();
      currentCpZ = z;
    }
    const b = map.getBounds();
    const sw = ll2tile(b.getSouth(), b.getWest(), z);
    const ne = ll2tile(b.getNorth(), b.getEast(), z);
    const fetches = [];
    for (let x = sw.x; x <= ne.x; x++)
      for (let y = ne.y; y <= sw.y; y++)
        fetches.push(loadTile(z, x, y));
    await Promise.all(fetches);
  }

  const CP_ATTR = '基準点データ: <a href="https://www.gsi.go.jp/" target="_blank">国土地理院</a>';

  map.on("moveend zoomend", update);
  map.on("overlayadd",    e => { if (e.name === "基準点") { map.attributionControl.addAttribution(CP_ATTR); update(); } });
  map.on("overlayremove", e => { if (e.name === "基準点") { map.attributionControl.removeAttribution(CP_ATTR); group.clearLayers(); loadedTiles.clear(); currentCpZ = -1; } });

  return group;
}

const cpLayer = createCpLayer();

// ---- レイヤーコントロール ----
L.control.layers(baseLayers, { "1次メッシュ": meshGrid, "基準点": cpLayer }, { position: "topright" }).addTo(map);

// ---- localStorage ----
const storageKey = "sota_viewer_" + GEOJSON_DATA.metadata.generated_at;
let savedInputs = {};
try { savedInputs = JSON.parse(localStorage.getItem(storageKey) || "{}"); } catch(e) {}

// ---- フィルター用レイヤーグループ ----
// カテゴリ: new / deleted / changed（matched で入力あり）/ unchanged（matched で入力なし）
const filterGroups = {
  new:       L.layerGroup().addTo(map),
  deleted:   L.layerGroup().addTo(map),
  changed:   L.layerGroup().addTo(map),
  unchanged: L.layerGroup().addTo(map),
};

// ピークの coordKey → カテゴリ のマップ（フィーチャ振り分け用）
const peakCategory = {};

// カテゴリ判定（peak フィーチャ用）
function categorize(matchStatus, coordKey) {
  if (matchStatus === "new")     return "new";
  if (matchStatus === "deleted") return "deleted";
  const s = savedInputs[coordKey] || {};
  return (s.jp || s.en) ? "changed" : "unchanged";
}

// フィーチャをカテゴリに振り分けて描画
function renderFeatures() {
  Object.values(filterGroups).forEach(g => g.clearLayers());

  // peak_lat/lon → category を先に解決
  GEOJSON_DATA.features.forEach(f => {
    const p = f.properties;
    if (p.type !== "peak") return;
    const coordKey = `${f.geometry.coordinates[1]}_${f.geometry.coordinates[0]}`;
    peakCategory[coordKey] = categorize(p.match_status, coordKey);
  });

  GEOJSON_DATA.features.forEach(f => {
    const p = f.properties;
    const geom = f.geometry;
    const color = pointsToColor(p.points);

    // peak → category を peakCategory から解決
    // activation_area / col / prominence_range / coord_diff / key_col_boundary は
    // 対応 peak の peak_lat/lon からカテゴリを取得
    function catByPeak(lat, lon) {
      return peakCategory[`${lat}_${lon}`] || "unchanged";
    }

    if (p.type === "activation_area") {
      const cat = catByPeak(p.peak_lat, p.peak_lon);
      L.polygon(geom.coordinates[0].map(c => [c[1], c[0]]), {
        color, fillColor: color, fillOpacity: 0.1, weight: 1
      }).addTo(filterGroups[cat]);
      return;
    }

    if (p.type === "key_col_boundary") {
      const cat = catByPeak(p.peak_lat, p.peak_lon);
      const pkColor = pointsToColor(
        GEOJSON_DATA.features.find(
          f2 => f2.properties.type === "peak"
            && f2.geometry.coordinates[1] === p.peak_lat
            && f2.geometry.coordinates[0] === p.peak_lon
        )?.properties.points
      );
      L.polygon(geom.coordinates[0].map(c => [c[1], c[0]]), {
        color: pkColor, fillColor: pkColor, fillOpacity: 0.15, weight: 1.5, dashArray: "4,3"
      }).addTo(filterGroups[cat]);
      return;
    }

    if (p.type === "prominence_range") {
      // LineString の始点座標（ピーク座標）でカテゴリ解決
      const [lon, lat] = geom.coordinates[0];
      const cat = catByPeak(lat, lon);
      L.polyline(geom.coordinates.map(c => [c[1], c[0]]),
        { color: "#aaa", weight: 1.5, dashArray: "4,3" }).addTo(filterGroups[cat]);
      return;
    }

    if (p.type === "coord_diff") {
      const [lon, lat] = geom.coordinates[0];
      const cat = catByPeak(lat, lon);
      L.polyline(geom.coordinates.map(c => [c[1], c[0]]),
        { color: "#aaa", weight: 1.5, dashArray: "4,3" }).addTo(filterGroups[cat]);
      return;
    }

    if (p.type === "peak") {
      const coordKey = `${geom.coordinates[1]}_${geom.coordinates[0]}`;
      const cat = peakCategory[coordKey];
      const saved = savedInputs[coordKey] || {};
      const marker = L.marker([geom.coordinates[1], geom.coordinates[0]], { icon: peakIcon(color) });

      const pkLat = geom.coordinates[1].toFixed(5);
      const pkLon = geom.coordinates[0].toFixed(5);
      if (p.match_status === "new") {
        marker.bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-caret-up" style="color:${color}"></i> 新規ピーク<span class="popup-badge">new</span></div>
          <div class="popup-row"><label>仮コード</label>${p.provisional_code}</div>
          <div class="popup-row"><label>緯度</label>${pkLat}</div>
          <div class="popup-row"><label>経度</label>${pkLon}</div>
          <div class="popup-row"><label>標高</label>${p.peak_elev}m</div>
          <div class="popup-row"><label>プロミネンス</label>${p.prominence}m</div>
          <div class="popup-row"><label>山岳名JP</label><input class="popup-input" id="jp_${coordKey}" value="${saved.jp||''}" placeholder="例: ○○山"></div>
          <div class="popup-row"><label>山岳名EN</label><input class="popup-input" id="en_${coordKey}" value="${saved.en||''}" placeholder="例: Maruyama"></div>
          <button class="popup-save" onclick="saveInput('${coordKey}')">保存</button>
          <div class="popup-hint">入力内容はブラウザに自動保存されます</div>
        `);
      } else if (p.match_status === "matched") {
        marker.bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-caret-up" style="color:${color}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">matched</span></div>
          <div class="popup-row"><label>コード</label>${p.summit_code}</div>
          <div class="popup-row"><label>緯度</label>${pkLat}</div>
          <div class="popup-row"><label>経度</label>${pkLon}</div>
          <div class="popup-row"><label>解析標高</label>${p.peak_elev}m</div>
          <div class="popup-row" style="margin-top:6px;color:#555">名称修正（任意）</div>
          <div class="popup-row"><label>山岳名JP</label><input class="popup-input" id="jp_${coordKey}" value="${saved.jp||''}" placeholder="${p.summit_name_jp||''}"></div>
          <div class="popup-row"><label>山岳名EN</label><input class="popup-input" id="en_${coordKey}" value="${saved.en||''}" placeholder="${p.summit_name}"></div>
          <button class="popup-save" onclick="saveInput('${coordKey}')">保存</button>
          <div class="popup-hint">未入力時は変更行を出力しません</div>
        `);
      } else {
        marker.bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-caret-up" style="color:${color}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">deleted</span></div>
          <div class="popup-row"><label>コード</label>${p.summit_code}</div>
          <div class="popup-row"><label>緯度</label>${pkLat}</div>
          <div class="popup-row"><label>経度</label>${pkLon}</div>
          <div class="popup-row"><label>解析標高</label>${p.peak_elev}m</div>
          <div class="popup-row"><label>プロミネンス</label>${p.prominence}m</div>
        `);
      }
      marker.addTo(filterGroups[cat]);
      return;
    }

    if (p.type === "col") {
      // col の peak_lat/lon からカテゴリ解決
      const cat = catByPeak(p.peak_lat, p.peak_lon);
      const colLat = geom.coordinates[1].toFixed(5);
      const colLon = geom.coordinates[0].toFixed(5);
      const colParentPeak = GEOJSON_DATA.features.find(
        f2 => f2.properties.type === "peak"
          && f2.geometry.coordinates[1] === p.peak_lat
          && f2.geometry.coordinates[0] === p.peak_lon
      );
      const colPeakCode = colParentPeak?.properties.summit_code
                       || colParentPeak?.properties.provisional_code
                       || "";
      const colCodeLabel = colParentPeak?.properties.match_status === "new" ? "仮コード" : "コード";
      L.marker([geom.coordinates[1], geom.coordinates[0]], { icon: colIcon(color) })
        .bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-caret-down" style="color:${color}"></i> Keyコル</div>
          ${colPeakCode ? `<div class="popup-row"><label>${colCodeLabel}</label>${colPeakCode}</div>` : ""}
          <div class="popup-row"><label>緯度</label>${colLat}</div>
          <div class="popup-row"><label>経度</label>${colLon}</div>
          <div class="popup-row"><label>標高</label>${p.col_elev}m</div>
        `)
        .addTo(filterGroups[cat]);
      return;
    }

    if (p.type === "sota_summit") {
      // sota_summit は peak と同じ summit_code でカテゴリを解決
      const peakFeature = GEOJSON_DATA.features.find(
        f2 => f2.properties.type === "peak" && f2.properties.summit_code === p.summit_code
      );
      const cat = peakFeature
        ? catByPeak(peakFeature.geometry.coordinates[1], peakFeature.geometry.coordinates[0])
        : (p.match_status === "deleted" ? "deleted" : "unchanged");
      const badge = p.match_status === "deleted" ? "deleted" : "matched";
      const sotaLat = geom.coordinates[1].toFixed(5);
      const sotaLon = geom.coordinates[0].toFixed(5);
      L.marker([geom.coordinates[1], geom.coordinates[0]], { icon: sotaIcon(color) })
        .bindPopup(`
          <div class="popup-title"><i class="fa-solid fa-circle" style="color:${color}"></i> ${p.summit_name_jp || p.summit_name}<span class="popup-badge">${badge}</span></div>
          <div class="popup-row"><label>コード</label>${p.summit_code}</div>
          <div class="popup-row"><label>緯度</label>${sotaLat}</div>
          <div class="popup-row"><label>経度</label>${sotaLon}</div>
          <div class="popup-row"><label>SOTA標高</label>${p.sota_alt_m}m</div>
        `)
        .addTo(filterGroups[cat]);
    }
  });
}

renderFeatures();

// ---- フィルター チェックボックス ----
document.querySelectorAll("#filters input[type='checkbox']").forEach(cb => {
  cb.addEventListener("change", () => {
    if (cb.checked) filterGroups[cb.dataset.cat].addTo(map);
    else            map.removeLayer(filterGroups[cb.dataset.cat]);
  });
});

// ---- localStorage 保存 ----
function saveInput(key) {
  const jp = document.getElementById("jp_" + key)?.value || "";
  const en = document.getElementById("en_" + key)?.value || "";
  savedInputs[key] = { jp, en };
  localStorage.setItem(storageKey, JSON.stringify(savedInputs));
  renderFeatures(); // 変更あり/なし の再分類
  // 再描画後に変更したフィルターグループを地図に反映
  document.querySelectorAll(".filter-btn").forEach(b => {
    if (b.classList.contains("active")) filterGroups[b.dataset.cat].addTo(map);
  });
}

// ---- ボタン ----
document.getElementById("btn-export").addEventListener("click", () => {
  alert("（モックアップ）申請書 XLSX をエクスポートします\n実物では SheetJS で XLSX を生成してダウンロードします");
});
document.getElementById("btn-publish").addEventListener("click", () => {
  alert("（モックアップ）公開用 HTML をエクスポートします\n実物では入力内容を埋め込んだ閲覧専用 HTML をダウンロードします");
});
</script>
</body>
</html>
