<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEM カラースキーム色見本</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap');

  :root {
    --bg: #0d0f14;
    --surface: #161a24;
    --surface2: #1e2433;
    --border: #2a3148;
    --text: #e8ecf4;
    --text-muted: #7a85a0;
    --accent: #4fc3f7;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans JP', sans-serif;
    min-height: 100vh;
    padding: 2rem 1.5rem;
  }

  header {
    text-align: center;
    margin-bottom: 2.5rem;
  }

  header h1 {
    font-family: 'Space Mono', monospace;
    font-size: 1.1rem;
    letter-spacing: 0.2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 0.4rem;
  }

  header p {
    color: var(--text-muted);
    font-size: 0.85rem;
    font-weight: 300;
  }

  .schemes-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.8rem;
    max-width: 720px;
    margin: 0 auto;
  }

  .scheme-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    transition: border-color 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .scheme-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
  }

  .scheme-card.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent)22;
  }

  .gradient-bar {
    height: 48px;
    width: 100%;
    position: relative;
  }

  .gradient-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.3));
  }

  .scheme-info {
    padding: 1rem 1.2rem;
  }

  .scheme-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 0.5rem;
  }

  .scheme-name {
    font-family: 'Space Mono', monospace;
    font-size: 0.9rem;
    font-weight: 700;
    color: var(--text);
  }

  .scheme-tag {
    font-size: 0.7rem;
    padding: 0.2rem 0.55rem;
    border-radius: 99px;
    background: var(--surface2);
    color: var(--text-muted);
    border: 1px solid var(--border);
  }

  .scheme-desc {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-weight: 300;
    line-height: 1.5;
    margin-bottom: 0.9rem;
  }

  .stops-row {
    display: flex;
    gap: 0.45rem;
    flex-wrap: wrap;
  }

  .stop-chip {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 0.25rem 0.5rem;
    font-family: 'Space Mono', monospace;
    font-size: 0.68rem;
    color: var(--text-muted);
    transition: color 0.2s;
    cursor: pointer;
    position: relative;
  }

  .stop-chip:hover { color: var(--text); }

  .stop-swatch {
    width: 11px;
    height: 11px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  .copied-toast {
    position: fixed;
    bottom: 1.5rem;
    left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: var(--accent);
    color: #000;
    font-family: 'Space Mono', monospace;
    font-size: 0.78rem;
    padding: 0.5rem 1.2rem;
    border-radius: 99px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s, transform 0.25s;
    white-space: nowrap;
    z-index: 999;
  }

  .copied-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  .section-label {
    font-family: 'Space Mono', monospace;
    font-size: 0.65rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 1rem;
    margin-top: 2rem;
    padding-left: 0.2rem;
    max-width: 720px;
    margin-left: auto;
    margin-right: auto;
  }

  .section-label:first-of-type { margin-top: 0; }
</style>
</head>
<body>

  <h1>DEM Color Schemes</h1>
  <p>デジタル標高地形図 カラースキーム色見本　— 色コードをクリックでコピー</p>
</header>

<div id="app"></div>

<div class="copied-toast" id="toast">コピーしました</div>

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgb(${r}, ${g}, ${b})`;
}

function buildGradient(stops) {
  const colors = stops.map((s,i) => `${s.color} ${Math.round(i/(stops.length-1)*100)}%`).join(', ');
  return `linear-gradient(to right, ${colors})`;
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(() => showToast(`コピー: ${text}`));
}

const app = document.getElementById('app');
let html = '';

schemes.forEach(section => {
  html += `<div class="section-label">${section.category}</div>`;
  html += `<div class="schemes-grid">`;
  section.items.forEach((scheme, si) => {
    const gradient = buildGradient(scheme.stops);
    const stopsHtml = scheme.stops.map(s =>
      `<div class="stop-chip" onclick="copyText('${s.color}')" title="${hexToRgb(s.color)}">
        <div class="stop-swatch" style="background:${s.color};border:1px solid rgba(255,255,255,0.15)"></div>
        <span>${s.label}</span>
        <span style="color:#4fc3f7;margin-left:2px">${s.color}</span>

    ).join('');

    html += `
    <div class="scheme-card">
      <div class="gradient-bar" style="background:${gradient}"></div>
      <div class="scheme-info">

          <span class="scheme-tag">${scheme.tag}</span>
        </div>

        <div class="stops-row">${stopsHtml}</div>

  });

});

app.innerHTML = html;

</html>
