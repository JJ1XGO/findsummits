name: lint (latest tools)

on:
  schedule:
    - cron: '0 0 1 * *'  # 毎月1日 00:00 UTC（JST 09:00）
  workflow_dispatch:

jobs:
  lint-latest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run lint with latest tools
        run: make lint-latest
